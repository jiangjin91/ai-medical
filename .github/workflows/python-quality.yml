name: Python 代码质量检查

# 推送到主分支，或向主分支创建/更新 Pull Request 时自动执行。
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# CI 仅需要读取代码，不授予写入仓库或发布权限。
permissions:
  contents: read

jobs:
  pylint:
    name: Pylint 静态检查
    runs-on: ubuntu-latest

    steps:
      # 拉取触发本次工作流的代码版本。
      - name: 检出代码
        uses: actions/checkout@v4

      # 两个后端服务都支持 Python 3.12；ai-service 也要求 3.12 及以上版本。
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 使用 uv 创建隔离环境并安装锁定依赖。
      - name: 安装 uv
        uses: astral-sh/setup-uv@v5

      - name: 安装 ai-service 依赖
        working-directory: ai-service
        run: uv sync --locked

      # 使用项目根目录的统一规则，检查 AI 服务源码。
      - name: 检查 ai-service
        working-directory: ai-service
        run: uv run pylint --rcfile ../.pylintrc atguigu

      - name: 安装 backend-service 依赖
        working-directory: backend-service
        run: uv sync --locked

      # backend-service 未把 Pylint 作为项目运行依赖；CI 中临时注入，不污染生产依赖。
      - name: 检查 backend-service
        working-directory: backend-service
        run: uv run --with pylint pylint --rcfile ../.pylintrc app
